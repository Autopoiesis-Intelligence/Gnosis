name: Gnosis Port CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  port:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gnosis-terminal-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Run Internet Port tests
        run: python -m pytest -q tests/test_internet_port.py tests/test_http_port_contract.py tests/test_internet_port_security.py tests/test_external_exposure.py tests/test_chat_server.py
