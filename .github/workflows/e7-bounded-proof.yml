name: E7 Bounded Proof

on:
  push:
  workflow_dispatch:

jobs:
  bounded-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact pushed commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Execute real bounded runtime
        run: |
          python tools/run_first_task.py             --output runtime-evidence/first-task.json             --database runtime-evidence/first-task.sqlite

      - name: Execute E7.107-E7.110 proof composition
        run: |
          python tools/run_e7_bounded_proof.py             --target-commit-sha "${GITHUB_SHA}"             --evidence runtime-evidence/first-task.json             --output runtime-evidence/e7-proof-manifest.json

      - name: Verify E7 adversarial tests
        run: |
          python -m pytest -q             tests/test_e7_107_108.py             tests/test_e7_109_acceptance.py             tests/test_e7_110_reconciliation.py             tests/test_e7_cross_layer_validation.py             tests/test_e7_proof_manifest.py

      - name: Upload bounded proof evidence
        uses: actions/upload-artifact@v4
        with:
          name: e7-bounded-proof
          path: runtime-evidence/
          if-no-files-found: error
